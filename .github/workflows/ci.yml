name: ci
on: { pull_request: {}, push: { branches: [main] } }
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      # Build the same static export the deploy workflow publishes (GitHub
      # Pages), then run Lighthouse against it — `next start` can't serve
      # an output:export build.
      - run: pnpm build
        env:
          NEXT_PUBLIC_STATIC_EXPORT: "1"
      - run: pnpm exec lhci autorun --collect.url=http://localhost:3000 --collect.startServerCommand="npx -y serve out"
